name: Release

# Pushing a bare semver tag (0.2.3, no `v`) builds the release here, attests
# main.js and manifest.json, and publishes the GitHub release with both attached.
# The Obsidian directory installs from the release whose tag equals the version in
# manifest.json, and its automated review recommends attested release assets: an
# attestation proves the files were built by this workflow from this repository's
# code, not on a laptop. Check one with
#   gh attestation verify main.js -R nick-vogel/obsidian-riverbed
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# One release per tag, and a running release is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, attest and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # The tag, manifest.json, package.json and versions.json must agree, or the
      # directory would install a release whose manifest names another version.
      - name: The tag matches the version everywhere
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # shellcheck disable=SC2016 # the single quotes hold JavaScript, whose ${} is meant for node
          node -e '
            const fs = require("node:fs")
            const tag = process.env.TAG
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"))
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"))
            const problems = []
            if (manifest.version !== tag) problems.push(`manifest.json has ${manifest.version}`)
            if (pkg.version !== tag) problems.push(`package.json has ${pkg.version}`)
            if (versions[tag] !== manifest.minAppVersion) problems.push(`versions.json maps ${tag} to ${versions[tag]}, not ${manifest.minAppVersion}`)
            if (problems.length) { console.error(`::error::tag ${tag}: ${problems.join("; ")}`); process.exit(1) }
            console.log(`tag ${tag} matches manifest.json, package.json and versions.json`)
          '

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Fault-injection sentinel absent from the production bundle
        run: |
          if grep -q 'riverbed-fail-write' main.js; then
            echo "::error::fault-injection sentinel found in the production bundle"
            exit 1
          fi
          echo "sentinel absent"

      - name: Attest main.js and manifest.json
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Publish the release with both files attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" main.js manifest.json --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
